sonar.projectKey=collector-shop
sonar.projectName=Collector Shop
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Root directory for sources - ONLY analyze src folders
sonar.sources=frontend/src,backend/src

# Exclude everything except src folders
sonar.exclusions=**/*

# Explicitly include only src folders
sonar.inclusions=frontend/src/**,backend/src/**

# Exclude test files from coverage analysis
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/tests/**,**/__tests__/**

# Coverage files
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# File suffixes
sonar.javascript.file.suffixes=.js,.jsx,.ts,.tsx
sonar.typescript.file.suffixes=.ts

# Code smells and quality gate
sonar.qualitygate.wait=true
