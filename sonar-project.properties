sonar.projectKey=collector-shop
sonar.projectName=Collector Shop
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Root directory for sources
sonar.sources=frontend/src,backend/src

# Exclude test files from coverage analysis
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/tests/**,**/__tests__/**,**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**

# Coverage files
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Test files (for reporting purposes, but excluded from coverage)
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/tests/**,**/__tests__/**

# Frontend specific
sonar.javascript.file.suffixes=.js,.jsx,.ts,.tsx

# Backend specific
sonar.typescript.file.suffixes=.ts

# Code smells and quality gate
sonar.qualitygate.wait=true
