sonar.projectKey=collector-shop
sonar.projectName=Collector Shop
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Root directory for sources - ONLY analyze src folders
# Analyze only frontend sources for now (quick CI pass)
sonar.sources=frontend/src

# Exclusions: common build and test artefacts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.github/**,**/build-wrapper-dump.json,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/tests/**,**/__tests__/**

# Explicitly include only frontend src
sonar.inclusions=frontend/src/**

# Exclude test files from coverage analysis
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/tests/**,**/__tests__/**

# Coverage file(s)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# File suffixes - Clear separation to avoid conflicts
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Code smells and quality gate
sonar.qualitygate.wait=true
