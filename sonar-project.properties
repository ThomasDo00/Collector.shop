sonar.projectKey=collector-shop
sonar.projectName=Collector Shop
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Root directory for sources
sonar.sources=frontend/src,backend/src

# Test files (excluded from coverage)
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/tests/**,**/__tests__/**

# Coverage file(s)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info

# File suffixes - Clear separation to avoid conflicts
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Code smells and quality gate
# Disabled to avoid blocking CI - view results in SonarCloud dashboard instead
sonar.qualitygate.wait=false