apiVersion: v1
kind: Secret
metadata:
  name: collector-secrets
  namespace: collector-prod
type: Opaque
stringData:
  # Database
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_PASSWORD_32_CHARS"
  DATABASE_URL: "postgresql://collector:CHANGE_ME_STRONG_PASSWORD_32_CHARS@postgres:5432/collector_prod?sslmode=disable"

  # Redis
  REDIS_PASSWORD: "CHANGE_ME_STRONG_REDIS_PASSWORD"
  REDIS_URL: "redis://:CHANGE_ME_STRONG_REDIS_PASSWORD@redis:6379"

  # JWT
  JWT_SECRET: "CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_BASE64_64"

  # Stripe
  STRIPE_SECRET_KEY: "sk_live_your_live_stripe_secret_key"
  STRIPE_WEBHOOK_SECRET: "whsec_your_live_webhook_secret"

  # MinIO / S3
  S3_ACCESS_KEY: "CHANGE_ME_MINIO_ACCESS_KEY"
  S3_SECRET_KEY: "CHANGE_ME_MINIO_SECRET_KEY"

  # SendGrid
  SENDGRID_API_KEY: "SG.your_sendgrid_api_key"
