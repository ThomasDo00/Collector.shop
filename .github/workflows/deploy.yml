name: Deploy

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
  
  # Auto deploy on main branch
  push:
    branches:
      - main

jobs:
  # Determine environment
  setup:
    name: Setup Deployment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

  # Build and prepare artifacts
  build:
    name: Build for Deployment
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Build backend
        run: npm run build:backend

      - name: Build frontend
        run: npm run build:frontend
        env:
          VITE_API_URL: ${{ needs.setup.outputs.environment == 'production' && secrets.PROD_API_URL || secrets.STAGING_API_URL }}

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r backend/dist deploy/backend
          cp -r backend/package*.json deploy/backend/
          cp -r frontend/dist deploy/frontend
          tar -czf deploy.tar.gz deploy/

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deploy.tar.gz
          retention-days: 7

  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: needs.setup.outputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.collector.shop
    
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Extract deployment package
        run: tar -xzf deploy.tar.gz

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment"
          echo "📦 Deployment package ready"
          # TODO: Add your deployment commands here
          # Examples:
          # - Deploy to AWS: aws s3 sync deploy/frontend s3://your-bucket
          # - Deploy to Vercel: vercel deploy --prod
          # - Deploy to Docker: docker build && docker push
          # - Deploy via SSH: scp -r deploy/ user@server:/path/to/app

      - name: Run database migrations
        run: |
          echo "🔄 Running database migrations"
          # TODO: Add migration commands
          # cd deploy/backend && npm run migrate

      - name: Health check
        run: |
          echo "🏥 Checking application health"
          # TODO: Add health check
          # curl -f https://staging.collector.shop/health || exit 1

      - name: Notify deployment
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "Environment: Staging" >> $GITHUB_STEP_SUMMARY
          echo "URL: https://staging.collector.shop" >> $GITHUB_STEP_SUMMARY

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: needs.setup.outputs.environment == 'production'
    environment:
      name: production
      url: https://collector.shop
    
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Extract deployment package
        run: tar -xzf deploy.tar.gz

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production environment"
          echo "📦 Deployment package ready"
          # TODO: Add your production deployment commands here

      - name: Run database migrations
        run: |
          echo "🔄 Running database migrations"
          # TODO: Add migration commands

      - name: Health check
        run: |
          echo "🏥 Checking application health"
          # TODO: Add health check
          # curl -f https://collector.shop/health || exit 1

      - name: Notify deployment
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "Environment: Production" >> $GITHUB_STEP_SUMMARY
          echo "URL: https://collector.shop" >> $GITHUB_STEP_SUMMARY

  # Rollback option
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure()
    needs: [deploy-staging, deploy-production]
    
    steps:
      - name: Rollback
        run: |
          echo "❌ Deployment failed, initiating rollback"
