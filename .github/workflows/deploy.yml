name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - production
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: thomasdo00/collector

jobs:
  # ===========================================
  # Build and Push Docker Images to GHCR
  # ===========================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================
  # Security Scan - Trivy (Container Scanning)
  # ===========================================
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
        continue-on-error: true

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
        continue-on-error: true

      - name: Upload Frontend Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'trivy-frontend'

      - name: Upload Backend Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'trivy-backend'

  # ===========================================
  # Deploy to K3s via kubectl
  # ===========================================
  deploy:
    name: Deploy to K3s
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://collector-shop.online

    steps:
      - name: Configure kubectl
        uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ secrets.KUBE_CONFIG }}

      - name: Update images
        run: |
          kubectl set image deployment/backend \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }} \
            -n collector-prod

          kubectl set image deployment/frontend \
            frontend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }} \
            -n collector-prod

      - name: Wait for rollout
        run: |
          if ! kubectl rollout status deployment/backend -n collector-prod --timeout=600s; then
            echo "::error::Backend rollout timed out"
            echo "=== Pod status ==="
            kubectl get pods -n collector-prod -l app=backend
            echo "=== Recent events ==="
            kubectl describe pods -n collector-prod -l app=backend | grep -A 20 "Events:"
            echo "=== Pod logs (last 50 lines) ==="
            kubectl logs -n collector-prod -l app=backend --tail=50 || true
            exit 1
          fi

          if ! kubectl rollout status deployment/frontend -n collector-prod --timeout=300s; then
            echo "::error::Frontend rollout timed out"
            echo "=== Pod status ==="
            kubectl get pods -n collector-prod -l app=frontend
            echo "=== Recent events ==="
            kubectl describe pods -n collector-prod -l app=frontend | grep -A 20 "Events:"
            exit 1
          fi

      - name: Deployment Summary
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://collector-shop.online" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pods:**" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n collector-prod >> $GITHUB_STEP_SUMMARY

  # ===========================================
  # Run Database Migrations
  # ===========================================
  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Configure kubectl
        uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ secrets.KUBE_CONFIG }}

      - name: Run migrations
        run: |
          kubectl exec -n collector-prod deployment/backend -- \
            npx tsx node_modules/knex/bin/cli.js migrate:latest \
            --knexfile src/core/database/knexfile.ts

  # ===========================================
  # Rollback on Failure
  # ===========================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: [deploy, migrate]
    if: failure()

    steps:
      - name: Configure kubectl
        uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ secrets.KUBE_CONFIG }}

      - name: Rollback
        run: |
          kubectl rollout undo deployment/backend -n collector-prod
          kubectl rollout undo deployment/frontend -n collector-prod
          kubectl rollout status deployment/backend -n collector-prod
          kubectl rollout status deployment/frontend -n collector-prod

      - name: Rollback Summary
        run: |
          echo "## ⚠️ Rollback Executed" >> $GITHUB_STEP_SUMMARY
          echo "Deployment failed and was rolled back to previous version." >> $GITHUB_STEP_SUMMARY

  # ===========================================
  # Security Scan - OWASP ZAP (DAST)
  # ===========================================
  zap-scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    needs: migrate
    if: success()
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for application to stabilize
        run: sleep 30

      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: 'https://collector-shop.online/api/'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-api-report

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://collector-shop.online/'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-report
          path: |
            report_html.html
            report_json.json
          retention-days: 30
