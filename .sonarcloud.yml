sonar:
  projectKey: collector-shop
  projectName: Collector Shop
  organization: cesimaalsip5
  
  # Sources to analyze
  sources:
    - frontend/src
    - backend/src

  # Coverage file(s)
  javascript.lcov.reportPaths: frontend/coverage/lcov.info,backend/coverage/lcov.info

  # Tests directories (helps Sonar categorize tests)
  tests:
    - backend/tests
  
  # Test files (for test reports, but excluded from coverage)
  test.inclusions:
    - '**/*.test.ts'
    - '**/*.test.tsx'
    - '**/*.spec.ts'
    - '**/*.spec.tsx'
    - '**/tests/**'
    - '**/__tests__/**'
  
  # Code coverage - exclude ONLY unit test files
  coverage.exclusions:
    - '**/*.test.ts'
    - '**/*.test.tsx'
    - '**/*.spec.ts'
    - '**/*.spec.tsx'
    - '**/tests/**'
    - '**/__tests__/**'
  
  # File type associations - Clear separation to avoid conflicts
  javascript.file.suffixes: .js,.jsx
  typescript.file.suffixes: .ts,.tsx
  
  # Quality gates and analysis settings
  qualitygate.wait: true
  verbose: false
  verbose: false
